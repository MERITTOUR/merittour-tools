<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2027 골프 패키지 예약 안내 · 메리트투어</title>
<!-- 이 안내문은 손님께 보내는 주소로 옮겼습니다 → https://merittour.github.io/2027/
     사내 도구함 경로(merittour-tools/tools/booking/...)는 손님 공지용으로 쓰기 어려워
     merittour.github.io/2027/ 로 이전했습니다. 기존 주소를 저장해 두신 분을 위해
     즉시 이동 + 수동 링크를 함께 둡니다. -->
<meta http-equiv="refresh" content="0; url=https://merittour.github.io/2027/">
<link rel="canonical" href="https://merittour.github.io/2027/">
<style>
  :root{
    --paper:#F5F6F0; --surface:#FFFFFF; --ink:#23281C; --ink-soft:#545B47;
    --line:#E2E4D9; --olive:#647548; --olive-deep:#4F5E38;
    --sans:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Pretendard',system-ui,sans-serif;
  }
  /* 다크 모드 분기를 두지 않는다 — 같은 안내문이 기기 설정에 따라
     초록(다크)과 밝은 베이지(라이트)로 갈려 보여, 어느 쪽이 맞는지
     물어보게 됐다. 이 저장소는 라이트 모드 고정이다. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:36px 32px;max-width:460px;text-align:center}
  h1{font-size:19px;font-weight:800;margin:0 0 10px;letter-spacing:-.02em}
  p{font-size:15px;color:var(--ink-soft);margin:0 0 20px}
  a{display:inline-block;background:var(--olive);color:#fff;text-decoration:none;
    font-weight:800;font-size:15px;border-radius:10px;padding:12px 22px}
  a:hover{background:var(--olive-deep)}
</style>
</head>
<body>
  <div class="box">
    <h1>2027 예약 안내가 옮겨졌습니다</h1>
    <p>손님께 보내는 주소로 이전했습니다. 잠시 후 자동으로 이동합니다.</p>
    <a href="https://merittour.github.io/2027/">새 주소로 이동 →</a>
  </div>
</body>
</html>
