<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MERITTOUR · 리조트 날씨</title>
<script src="../../shared/gate.js"></script>
<meta name="robots" content="noindex, nofollow" />

<!-- 공통 디자인 엔진 (폰트·토큰·컴포넌트 전부 포함) -->
<link rel="stylesheet" href="../../shared/core.css">

<style>
/* ── weather 고유 스타일만 남김 (색은 모두 core.css 토큰 참조) ── */
.wx-intro { font-size: 13px; color: var(--mt-text2); margin: 0 0 8px; line-height: 1.65; }
.wx-intro .src { font-family: var(--mt-mono); font-size: 11px; color: var(--mt-text3); }
.wx-list { display: flex; flex-direction: column; gap: 10px; }
.wx-row {
  background: var(--mt-surface); border: 1px solid var(--mt-border);
  border-left: 3px solid var(--mt-accent); border-radius: 10px;
  padding: 14px 16px; box-shadow: var(--mt-shadow);
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.wx-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.wx-name { font-size: 15px; font-weight: 600; color: var(--mt-brand); }
.wx-meta { font-size: 11px; color: var(--mt-text3); font-family: var(--mt-mono); letter-spacing: .03em; }
.wx-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wx-actions .mt-btn { font-size: 12.5px; padding: 8px 14px; text-decoration: none; white-space: nowrap; }
.mt-btn.copied { color: var(--mt-green-dark); border-color: var(--mt-green-dark); background: var(--mt-green-dim); }
.wx-note h3 { font-size: 12px; color: var(--mt-brand); margin-bottom: 8px; display: flex; align-items: center; gap: 7px; font-weight: 700; }
.wx-note h3::before { content: ''; width: 3px; height: 12px; background: var(--mt-point); border-radius: 2px; }
.wx-note p { font-size: 12px; color: var(--mt-text2); line-height: 1.7; }
.wx-note code { font-family: var(--mt-mono); background: var(--mt-surface3); padding: 1px 5px; border-radius: 3px; font-size: 11px; }
.wx-footer { text-align: center; color: var(--mt-text3); font-size: 11px; margin-top: 44px; font-family: var(--mt-mono); letter-spacing: .06em; }
@media (max-width: 560px) {
  .wx-row { flex-direction: column; align-items: stretch; }
  .wx-actions { justify-content: stretch; }
  .wx-actions .mt-btn { flex: 1; justify-content: center; }
}
</style>
</head>
<body>

<div class="mt-container">
  <div class="mt-header">
    <div class="mt-brand-wrap">
      <a href="../../sales/" class="mt-brand-link" title="영업 도구 홈으로"><img src="../../assets/logo-merittour-horizontal.svg" alt="MERITTOUR" class="mt-brand-logo"></a>
      <div class="mt-brand-sub">INTERNAL TOOLS</div>
      <span class="mt-dept-badge">리조트 날씨</span>
    </div>
    <div class="mt-header-actions">
      <a class="mt-btn mt-btn-ghost" href="../../sales/" title="영업 도구 홈">⌂ 홈</a>
    </div>
  </div>

  <p class="wx-intro">
    리조트별 현지 <strong>3시간 단위 날씨 예보</strong>를 바로 확인하고, 손님께 보낼 안내문을 한 번에 복사합니다.<br>
    <span class="src">출처: golfweather.info · 새 탭에서 열림</span>
  </p>

  <div id="wxRoot"></div>

  <div class="mt-card wx-note" style="margin-top:30px;">
    <h3>안내문 형식</h3>
    <p>"안내문 복사"를 누르면 아래 형식이 클립보드에 복사됩니다. 카카오톡에 바로 붙여넣으세요.<br>
    형식을 바꾸고 싶으시면 말씀해 주세요.</p>
  </div>

  <div class="wx-footer">MERITTOUR · 02-365-9800 · MAPO-GU SEOUL</div>
</div>

<!-- 공통 유틸 엔진 (MT.showToast 등) -->
<script src="../../shared/util.js"></script>
<script>
// ── 데이터: 권역 → 골프장 → golfweather.info ID (이 도구 고유) ──
const COURSES = [
  { region: '구마모토', name: '아소 야마나미 리조트', id: 1936 },
  { region: '구마모토', name: '구주고원 골프클럽',     id: 2231 },
  { region: '나고야',   name: '포틴힐즈 CC (14hills)', id: 1072 },
  { region: '벳푸',     name: '벳푸오기야마 골프클럽', id: 1865 },
  { region: '이바라키', name: '시로사토 CC',           id: 376  },
  { region: '이바라키', name: '후쿠로다노타키 CC',     id: 318  },
  { region: '미야자키', name: '미야자키 국제공항 CC',  id: 1873 },
  { region: '나가노',   name: '스가다이라 그린 CC',    id: 2283 },
];

const wxUrl = id => `https://www.golfweather.info/tenki/${id}/3hours`;

// 손님 안내문 템플릿
const buildMsg = (name, id) =>
`안녕하세요, 메리트투어입니다.
${name} 현지 날씨 예보를 안내드립니다.
${wxUrl(id)}
즐거운 라운딩 되시길 바랍니다.`;

// ── 렌더 ──
const root = document.getElementById('wxRoot');
const regions = [...new Set(COURSES.map(c => c.region))];
regions.forEach(region => {
  const title = document.createElement('div');
  title.className = 'mt-section-title';
  title.textContent = region;
  root.appendChild(title);

  const list = document.createElement('div');
  list.className = 'wx-list';
  COURSES.filter(c => c.region === region).forEach(c => {
    const row = document.createElement('div');
    row.className = 'wx-row';
    row.innerHTML = `
      <div class="wx-info">
        <div class="wx-name"></div>
        <div class="wx-meta">golfweather · ID ${c.id}</div>
      </div>
      <div class="wx-actions">
        <a class="mt-btn mt-btn-primary" target="_blank" rel="noopener">🌤️ 날씨 보기</a>
        <button class="mt-btn mt-btn-ghost" type="button">📋 안내문 복사</button>
      </div>`;
    row.querySelector('.wx-name').textContent = c.name;
    row.querySelector('a.mt-btn-primary').href = wxUrl(c.id);
    const copyBtn = row.querySelector('button.mt-btn-ghost');
    copyBtn.addEventListener('click', () => copyMsg(c, copyBtn));
    list.appendChild(row);
  });
  root.appendChild(list);
});

// ── 복사 (토스트는 공통 MT.showToast 사용) ──
async function copyMsg(c, btn) {
  const text = buildMsg(c.name, c.id);
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e2) { ok = false; }
  }
  if (ok) {
    const orig = btn.innerHTML;
    btn.classList.add('copied'); btn.innerHTML = '✓ 복사됨';
    MT.showToast(c.name + ' 안내문 복사 완료');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1600);
  } else {
    MT.showToast('복사에 실패했습니다. 수동으로 복사해 주세요');
  }
}
</script>
</body>
</html>
