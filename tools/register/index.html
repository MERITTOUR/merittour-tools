<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>통합 업무 허브로 이동 · MERITTOUR</title>
<!-- 업로드는 통합 업무 허브의 「자료 불러오기 → ＋ 새 자료 올리기」로 합쳤습니다.
     올리는 곳과 보는 곳이 갈라져 있으면 매번 페이지를 왕복해야 해서 나눌 이득이
     없었습니다. 이 주소를 저장해 두신 분을 위해 이동만 남겨 둡니다. -->
<meta http-equiv="refresh" content="0; url=../dashboard/">
<script src="../../shared/guard.js"></script>
<style>
  :root{
    --bg:#EEF2F8; --surface:#fff; --navy:#1a2332; --accent:#2E5A88; --accent2:#4A7BB0;
    --text:#22303F; --text2:#5A6A7A; --border:#D8E0EA;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    width:100%;max-width:420px;padding:34px 30px;text-align:center;
    box-shadow:0 2px 20px rgba(26,35,50,.06)}
  .mark{width:26px;height:26px;border-radius:50%;margin:0 auto 14px;
    background:radial-gradient(circle at 34% 30%,var(--accent2),var(--navy))}
  h1{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px;color:var(--navy)}
  p{font-size:14px;color:var(--text2);margin:0 0 20px;line-height:1.7}
  a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    font-weight:800;font-size:14.5px;border-radius:9px;padding:11px 20px}
  a:hover{background:var(--navy)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>업로드가 통합 업무 허브로 합쳐졌습니다</h1>
    <p>「자료 불러오기」의 <b>＋ 새 자료 올리기</b>에서 올리시면 됩니다.<br>
      올린 뒤 그 자리에서 바로 열립니다.</p>
    <a href="../dashboard/">통합 업무 허브로 이동 →</a>
  </div>
</body>
</html>
