<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>엠클릭 통합 업로드 · MERITTOUR 사내 도구함</title>
<script src="../../shared/gate.js"></script>
<script src="../../shared/supabase-config.js"></script>
<script src="../../shared/access.js"></script>
<script src="../../shared/util.js"></script>
<script src="../../shared/store.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF2F8; --surface:#fff; --navy:#1a2332; --accent:#2E5A88; --accent2:#4A7BB0;
    --text:#22303F; --text2:#5A6A7A; --text3:#8A97A6; --border:#D8E0EA; --border2:#C3CEDB;
    --red:#C0392B; --red-dim:#FDECEA; --amber:#B7791F; --amber-dim:#FEF6E7;
    --green:#1E7A4C; --green-dim:#E7F6EE;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;
    min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    width:100%;max-width:760px;padding:34px 30px;box-shadow:0 2px 20px rgba(26,35,50,.06)}
  .brand{display:flex;align-items:center;gap:9px;margin:0 0 4px;
    font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--text2)}
  .brand .mark{width:22px;height:22px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 34% 30%,var(--accent2),var(--navy))}
  h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;color:var(--navy)}
  .sub{font-size:13.5px;color:var(--text2);margin:0 0 22px;line-height:1.6}
  .sub b{color:var(--text)}

  .msg{margin:0 0 16px;font-size:13.5px;line-height:1.6;border-radius:9px;padding:11px 13px;display:none}
  .msg.on{display:block}
  .msg.err{background:var(--red-dim);color:var(--red);border:1px solid #F5C6C0}
  .msg.warn{background:var(--amber-dim);color:var(--amber);border:1px solid #F0DCB0}
  .msg.ok{background:var(--green-dim);color:var(--green);border:1px solid #B7E2CB}

  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 20px}
  .topbar .who{font-size:12.5px;color:var(--text2)}
  .topbar .who b{color:var(--navy)}
  .topbar .sp{flex:1}
  button{padding:8px 14px;border:1px solid var(--border2);border-radius:8px;background:#fff;
    font-size:13.5px;font-weight:700;font-family:inherit;color:var(--text2);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  button.pri:hover:not(:disabled){background:var(--navy);border-color:var(--navy);color:#fff}
  button.big{width:100%;padding:13px;font-size:15px;margin-top:4px}

  .grp-h{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px;
    font-size:13px;font-weight:800;color:var(--navy)}
  .grp-h .n{font-size:12px;font-weight:700;color:#fff;background:var(--accent);
    border-radius:999px;padding:1px 8px}

  .drops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .drop{border:2px dashed var(--border2);border-radius:12px;padding:18px 16px;text-align:center;
    background:#FBFCFE;cursor:pointer;transition:border-color .15s,background .15s}
  .drop:hover,.drop.over{border-color:var(--accent);background:#F2F7FC}
  .drop.done{border-style:solid;border-color:var(--green);background:var(--green-dim)}
  .drop .t{font-size:14px;font-weight:800;color:var(--navy)}
  .drop .d{font-size:11.5px;color:var(--text3);margin-top:4px;line-height:1.5}
  .drop .m{font-size:12px;font-weight:700;color:var(--green);margin-top:7px;min-height:17px}
  .drop input{display:none}

  .paste{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--border2);
    border-radius:9px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--text);resize:vertical}
  .paste:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,90,136,.12)}

  .sum{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:#FBFCFE;margin-top:12px}
  .sum dl{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:0;font-size:13.5px}
  .sum dt{color:var(--text3);font-weight:700;font-size:12px;white-space:nowrap;padding-top:2px}
  .sum dd{margin:0;font-weight:700;color:var(--text)}
  .sum .warn{color:var(--amber)}
  .sum .up{color:var(--green)}
  .sum .down{color:var(--red)}

  .row{border:1px solid var(--border);border-radius:11px;padding:12px 14px;background:#fff}
  .row+.row{margin-top:8px}
  .row .r1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .row .p{font-size:15.5px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .row .s{font-size:12.5px;color:var(--text2)}
  .row .who{font-size:12px;color:var(--text3);margin-left:auto}
  .pill{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .pill.blk{background:var(--green-dim);color:var(--green);border:1px solid #B7E2CB}
  .pill.noblk{background:var(--amber-dim);color:var(--amber);border:1px solid #F0DCB0}
  .empty{font-size:13.5px;color:var(--text3);padding:12px 2px}

  .foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);
    font-size:12px;color:var(--text3);line-height:1.7}
  .foot b{color:var(--text2)}
  .hide{display:none}
  @media (max-width:560px){
    body{padding:14px}
    .card{padding:24px 18px}
    .drops{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark" aria-hidden="true"></span> MERITTOUR 사내 도구함</div>
  <h1>엠클릭 통합 업로드</h1>
  <p class="sub">엠클릭 파일을 <b>한 사람이 한 번</b> 올리면 모두가 같은 자료를 씁니다.<br>
    올린 뒤에는 대시보드에서 파일 없이 바로 불러 쓸 수 있습니다.</p>

  <div class="topbar hide" id="topbar">
    <span class="who">로그인: <b id="me-name"></b> <span id="me-role"></span></span>
    <span class="sp"></span>
    <button type="button" id="btn-reload">새로고침</button>
  </div>

  <div class="msg" id="msg"></div>

  <div id="work" class="hide">
    <div class="grp-h">파일 올리기</div>
    <div class="drops">
      <label class="drop" id="drop-res">
        <div class="t">예약리스트</div>
        <div class="d">예약현황 탭 · <b>500행씩 분할</b>된 파일은<br>여러 개 한 번에 고르면 합쳐집니다</div>
        <div class="m" id="meta-res"></div>
        <input type="file" id="file-res" accept=".xlsx,.xls" multiple>
      </label>
      <label class="drop" id="drop-ilhaeng">
        <div class="t">일행별예약</div>
        <div class="d">탑승자정보 탭 · <b>1개월 단위</b><br>여러 달이면 여러 개 고르세요</div>
        <div class="m" id="meta-ilhaeng"></div>
        <input type="file" id="file-ilhaeng" accept=".xlsx,.xls" multiple>
      </label>
    </div>

    <div class="grp-h">호텔 블록표 <span style="font-weight:600;color:var(--text3);font-size:11.5px">(선택)</span></div>
    <textarea class="paste" id="blk-paste" placeholder="엠클릭 호텔별 예약현황 표를 붙여넣으세요 (Ctrl+V) — 안 넣으면 이미 등록된 표가 그대로 유지됩니다"></textarea>

    <div class="sum" id="sum"></div>
    <button class="pri big" id="btn-save" disabled>서버에 올리기</button>

    <div class="grp-h">등록된 출발월 <span class="n" id="cnt">0</span></div>
    <div id="list"></div>
  </div>

  <div class="foot">
    <b>저장되는 것</b> — 예약리스트·일행별예약의 원본 행, 블록표(붙여넣은 경우), 등록자 이름과 시각.<br>
    같은 달을 다시 올리면 <b>통째로 교체</b>됩니다. 그 사이 다른 분이 올렸으면 저장 전에 알려 드립니다.
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var LOGIN = '../../login/?next=' + encodeURIComponent('../tools/register/');
  var ROLES = ['admin', 'manage', 'sales'];      // owner 는 access.js 에서 자동 통과

  var me = null;
  var resRows = null, resFiles = 0;
  var ilhRows = null, ilhFiles = 0;
  var periods = [];                 // 서버 목록
  var parsed = null;                // {period, teamCount, paxCount, months}
  var blkParsed = null;             // {rows, month}

  function say(text, kind) {
    var m = $('msg');
    m.className = 'msg on ' + (kind || 'err');
    m.innerHTML = text;
  }
  function clearMsg() { $('msg').className = 'msg'; $('msg').innerHTML = ''; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtWhen(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d)) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0')
         + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  /* ── 엑셀 읽기 ──────────────────────────────────────────────
     대시보드와 같은 방식으로 읽는다(cellDates:true, 첫 시트, defval:'').
     여기서 모양이 달라지면 대시보드가 다른 값을 보게 된다. */
  function readBook(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onerror = function () { reject(new Error(file.name + ' 을 읽지 못했습니다.')); };
      r.onload = function (e) {
        try {
          var wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
          var ws = wb.Sheets[wb.SheetNames[0]];
          resolve(XLSX.utils.sheet_to_json(ws, { defval: '' }));
        } catch (err) { reject(new Error(file.name + ' 을 엑셀로 읽지 못했습니다.')); }
      };
      r.readAsArrayBuffer(file);
    });
  }

  function pickFiles(kind, files) {
    files = Array.prototype.slice.call(files || []).filter(function (f) { return /\.xlsx?$/i.test(f.name); });
    if (!files.length) { say('엑셀 파일(.xlsx)만 올릴 수 있습니다.'); return; }
    clearMsg();
    var box = $('drop-' + kind), meta = $('meta-' + kind);
    meta.textContent = '읽는 중…';
    Promise.all(files.map(readBook)).then(function (books) {
      var merged = [];
      books.forEach(function (b) { merged = merged.concat(b); });
      if (kind === 'res') { resRows = merged; resFiles = files.length; }
      else { ilhRows = merged; ilhFiles = files.length; }
      box.classList.add('done');
      meta.textContent = (files.length > 1 ? files.length + '개 병합 · ' : '') + merged.length + '행';
      refresh();
    }).catch(function (e) {
      meta.textContent = '';
      box.classList.remove('done');
      say(e && e.message ? e.message : '파일을 읽지 못했습니다.');
    });
  }

  ['res', 'ilhaeng'].forEach(function (kind) {
    var box = $('drop-' + kind);
    $('file-' + kind).addEventListener('change', function (e) {
      pickFiles(kind, e.target.files);
      setTimeout(function () { e.target.value = ''; }, 60);
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      box.addEventListener(ev, function (e) { e.preventDefault(); box.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      box.addEventListener(ev, function (e) { e.preventDefault(); box.classList.remove('over'); });
    });
    box.addEventListener('drop', function (e) { pickFiles(kind, e.dataTransfer.files); });
  });

  /* ── 올린 자료 훑기 ─────────────────────────────────────────
     여기서는 분석하지 않는다. 어느 달인지·몇 팀인지만 세어
     사람이 「맞게 올렸나」를 눈으로 확인할 수 있게 한다. */
  /* 대시보드 analyze() 와 같은 기준으로 센다 — 여기 숫자와 대시보드 숫자가
     다르면 「몇 건이 줄었다」는 경고를 믿을 수 없게 된다. */
  var LIVE = ['견적', '대기', '확정', '정산'];
  function scanRes(rows) {
    var months = {}, pax = 0, n = 0;
    (rows || []).forEach(function (r) {
      if (r['cancCd']) return;
      if (LIVE.indexOf(String(r['구분'] || '').trim()) < 0) return;
      n++;
      pax += MT.num(r['예약']);
      var ymd = MT.normalizeDate(r['출발일자']);
      if (ymd) months[ymd.slice(0, 7)] = (months[ymd.slice(0, 7)] || 0) + 1;
    });
    return { months: months, monthKeys: Object.keys(months).sort(), teamCount: n, paxCount: pax };
  }

  /* 붙여넣은 블록표에서 대상 월만 읽는다. 표 자체는 원문 그대로 저장하고,
     행 해석은 대시보드가 한다 — 파서를 두 곳에 두면 갈라진다. */
  function scanBlock(text) {
    var t = String(text || '').trim();
    if (!t) return null;
    var m = t.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})/);
    return { month: m ? m[1] + '-' + String(m[2]).padStart(2, '0') : '' };
  }

  $('blk-paste').addEventListener('input', function () { blkParsed = scanBlock(this.value); refresh(); });

  /* ── 요약 · 저장 가능 여부 ─────────────────────────────────── */
  function refresh() {
    var box = $('sum'), btn = $('btn-save');
    if (!resRows && !ilhRows) {
      box.innerHTML = '<div class="empty">두 파일을 올리면 어느 달인지, 몇 팀인지 여기에 보여 드립니다.</div>';
      btn.disabled = true; parsed = null; return;
    }
    if (!resRows || !ilhRows) {
      box.innerHTML = '<div class="empty">' + (resRows ? '일행별예약' : '예약리스트') + ' 파일이 아직 없습니다.</div>';
      btn.disabled = true; parsed = null; return;
    }

    var sc = scanRes(resRows);
    if (!sc.monthKeys.length) {
      box.innerHTML = '<div class="empty" style="color:var(--red)">출발일자를 읽을 수 없습니다. 예약리스트 파일이 맞는지 확인해 주세요.</div>';
      btn.disabled = true; parsed = null; return;
    }
    // 가장 많은 달을 그 파일의 출발월로 본다(월 경계 팀이 조금 섞여 들어온다)
    var main = sc.monthKeys.slice().sort(function (a, b) { return sc.months[b] - sc.months[a]; })[0];
    parsed = { period: main, teamCount: sc.teamCount, paxCount: sc.paxCount, monthKeys: sc.monthKeys, months: sc.months };

    var before = periods.filter(function (p) { return p.period === main; })[0] || null;
    var d = MT_STORE.diff(before, {
      teamCount: sc.teamCount, paxCount: sc.paxCount,
      blockRows: blkParsed ? [] : undefined
    });

    var warn = [];
    if (sc.monthKeys.length > 1) {
      warn.push('여러 달이 섞여 있습니다 — ' + sc.monthKeys.map(function (k) {
        return k + ' ' + sc.months[k] + '팀';
      }).join(' · ') + '. <b>' + main + '</b> 로 등록합니다.');
    }
    if (blkParsed) {
      var chk = MT_STORE.checkBlockMonth(main, blkParsed.month);
      if (!chk.ok) warn.push(chk.message);
    }
    d.warnings.forEach(function (w) { warn.push(w); });

    var delta = function (v) {
      if (!before || !v) return '';
      return ' <span class="' + (v > 0 ? 'up' : 'down') + '">(' + (v > 0 ? '+' : '') + v + ')</span>';
    };
    box.innerHTML =
      '<dl>'
      + '<dt>출발월</dt><dd>' + esc(main) + (before ? ' <span class="s" style="font-weight:600;color:var(--text3)">· 이미 등록됨 (' + esc(fmtWhen(before.updatedAt)) + ' ' + esc(before.uploaderName) + ')</span>' : ' <span style="font-weight:600;color:var(--text3)">· 첫 등록</span>') + '</dd>'
      + '<dt>팀</dt><dd>' + d.team.to + '건' + delta(d.team.delta) + '</dd>'
      + '<dt>인원</dt><dd>' + d.pax.to + '명' + delta(d.pax.delta) + '</dd>'
      + '<dt>파일</dt><dd>예약리스트 ' + resFiles + '개 · 일행별예약 ' + ilhFiles + '개</dd>'
      + '<dt>블록표</dt><dd>' + (blkParsed
          ? '이번에 함께 올림' + (blkParsed.month ? ' (' + esc(blkParsed.month) + ')' : ' <span class="warn">(달을 못 읽음)</span>')
          : (before && before.hasBlock ? '이미 등록된 표 유지' : '없음'))
        + '</dd>'
      + '</dl>'
      + (warn.length ? '<div style="margin-top:9px;font-size:12.5px;line-height:1.7" class="warn">※ ' + warn.join('<br>※ ') + '</div>' : '');

    btn.disabled = false;
  }

  /* ── 저장 ───────────────────────────────────────────────────── */
  $('btn-save').addEventListener('click', function () {
    if (!parsed) return;
    var before = periods.filter(function (p) { return p.period === parsed.period; })[0] || null;
    if (before && !window.confirm(parsed.period + ' 은 이미 등록돼 있습니다.\n'
        + '(' + fmtWhen(before.updatedAt) + ' ' + (before.uploaderName || '') + ' · 팀 ' + before.teamCount + '건)\n\n'
        + '이번 파일로 통째로 교체할까요?')) return;

    var btn = $('btn-save');
    btn.disabled = true; btn.textContent = '저장 중…';
    clearMsg();

    var payload = {
      resRows: MT.encodeRows(resRows), resFiles: resFiles,
      ilhaengRows: MT.encodeRows(ilhRows), ilhaengFiles: ilhFiles,
      teamCount: parsed.teamCount, paxCount: parsed.paxCount,
      uploaderName: (me && (me.name || me.email)) || ''
    };
    var raw = $('blk-paste').value.trim();
    if (raw) {
      payload.blockRaw = raw;
      payload.blockRows = [];                  // 행 해석은 대시보드가 한다
      payload.blockMonth = (blkParsed && blkParsed.month) || parsed.period;
    }

    MT_STORE.save(parsed.period, payload, before ? { expect: before.updatedAt } : {})
      .then(function () {
        say('<b>' + esc(parsed.period) + '</b> 을 등록했습니다. 이제 대시보드에서 파일 없이 불러 쓰실 수 있습니다.', 'ok');
        return load();
      })
      .catch(function (e) {
        if (e && e.conflict) {
          say(esc(e.message) + ' <b>새로고침</b>을 누르고 다시 확인해 주세요.', 'warn');
          load();
        } else {
          say(esc((e && e.message) || '저장에 실패했습니다.'));
        }
      })
      .then(function () { btn.disabled = false; btn.textContent = '서버에 올리기'; });
  });

  /* ── 목록 ───────────────────────────────────────────────────── */
  function renderList() {
    $('cnt').textContent = periods.length;
    if (!periods.length) {
      $('list').innerHTML = '<div class="empty">아직 등록된 달이 없습니다. 위에서 첫 달을 올려 주세요.</div>';
      return;
    }
    $('list').innerHTML = periods.map(function (p) {
      return '<div class="row"><div class="r1">'
        + '<span class="p">' + esc(p.period) + '</span>'
        + '<span class="s">팀 ' + p.teamCount + '건 · 인원 ' + p.paxCount + '명</span>'
        + '<span class="pill ' + (p.hasBlock ? 'blk' : 'noblk') + '">'
        + (p.hasBlock ? '블록표 ' + esc(p.blockMonth || '') : '블록표 없음') + '</span>'
        + '<span class="who">' + esc(fmtWhen(p.updatedAt)) + ' ' + esc(p.uploaderName) + '</span>'
        + '</div></div>';
    }).join('');
  }

  function load() {
    return MT_STORE.listPeriods().then(function (list) {
      periods = list; renderList(); refresh();
    }).catch(function (e) {
      $('list').innerHTML = '';
      say(esc((e && e.message) || '등록 목록을 불러오지 못했습니다.'));
    });
  }

  /* ── 진입 ───────────────────────────────────────────────────── */
  if (!MT_AUTH.configured()) {
    say('접속 설정이 아직 비어 있습니다. shared/supabase-config.js 에 Supabase URL 과 anon key 를 넣어 주세요.', 'warn');
    return;
  }

  MT_AUTH.require(ROLES, { loginUrl: LOGIN, onDeny: function (res) {
    if (res.reason === 'no-session') { location.href = LOGIN; return; }
    if (res.reason === 'pending') say('계정이 아직 승인되지 않았습니다. 관리자에게 승인을 요청해 주세요.', 'warn');
    else if (res.reason === 'forbidden') say('등록 권한이 없습니다. 이 화면은 admin · manage · sales 만 쓸 수 있습니다. (air 는 읽기 전용)', 'warn');
    else say(esc(res.message || '확인에 실패했습니다.'));
  }}).then(function (res) {
    if (!res.ok) return;
    me = res.user;
    $('topbar').classList.remove('hide');
    $('work').classList.remove('hide');
    $('me-name').textContent = me.name || me.email;
    $('me-role').textContent = '(' + me.role + ')';
    refresh();
    return load();
  });

  $('btn-reload').addEventListener('click', function () { clearMsg(); load(); });
})();
</script>
</body>
</html>
