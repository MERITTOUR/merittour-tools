<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MERITTOUR · 골프 날씨</title>
<meta name="description" content="골프장·날짜별 라운딩 적합도를 한눈에 — 티타임 구간 날씨 종합 판정" />

<!-- 폰트 (CDN) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
:root{
  --navy:#101826; --navy-soft:rgba(255,255,255,.14);
  --ink:#0f1b2d; --ink-2:#334155; --muted:#64748b;
  --v-best:#0e9f6e; --v-good:#3cb371; --v-fair:#e8a33d; --v-poor:#ef7d2f; --v-bad:#e2483d;

  /* 글래스 — 하늘 위에 얹히는 반투명 판 */
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.80);
  --glass-line:rgba(255,255,255,.75);
  --glass-edge:rgba(15,27,45,.07);
  --blur:saturate(1.5) blur(22px);

  --sans:'Pretendard','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --serif:var(--sans);
  --r:22px; --r-sm:14px;
  --shadow:0 6px 22px rgba(15,27,45,.10);
  --shadow-lg:0 18px 44px rgba(15,27,45,.18);
}
/* 밤·새벽·노을에는 하늘이 어두워 반투명 유리가 회색으로 깔린다.
   글자 대비를 지키려고 유리를 더 불투명하게 올린다. */
body[data-phase="night"], body[data-phase="dawn"], body[data-phase="golden"]{
  --glass:rgba(255,255,255,.86);
  --glass-strong:rgba(255,255,255,.94);
  --glass-line:rgba(255,255,255,.55);
}
body[data-phase="night"] .fit,
body[data-phase="dawn"] .fit,
body[data-phase="golden"] .fit{ background:rgba(255,255,255,.62); border-color:rgba(255,255,255,.8); }
body[data-phase="night"] .metric,
body[data-phase="dawn"] .metric,
body[data-phase="golden"] .metric{ background:rgba(255,255,255,.58); border-color:rgba(255,255,255,.8); }
body[data-phase="night"] .hcell.tee,
body[data-phase="dawn"] .hcell.tee,
body[data-phase="golden"] .hcell.tee{ background:rgba(255,255,255,.60); }
body[data-phase="night"] .drow.on,
body[data-phase="dawn"] .drow.on,
body[data-phase="golden"] .drow.on{ background:rgba(255,255,255,.72); }

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ min-height:100%; }
body{
  font-family:var(--sans); color:var(--ink); background:#dceaf7;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  position:relative; overflow-x:hidden;
  font-feature-settings:'tnum' 1;
}
h1,h2,h3{ font-weight:700; letter-spacing:-.01em; }
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }

/* ══ 하늘 레이어 (§10) ══ */
.sky{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.sky-gradient{
  position:absolute; inset:0;
  background:linear-gradient(180deg, var(--sky-top,#bfe3ff) 0%, var(--sky-bot,#eaf6ff) 100%);
  transition:background 1.2s ease;
}
.celestial{
  position:absolute; width:74px; height:74px; border-radius:50%;
  left:var(--cx,50%); top:var(--cy,20%);
  transform:translate(-50%,-50%); transition:left 3s linear, top 3s linear, opacity 1.2s ease;
}
.celestial.sun{
  background:radial-gradient(circle at 50% 50%, #fff8dc 0%, #ffe08a 40%, rgba(255,214,102,.55) 62%, rgba(255,214,102,0) 72%);
  box-shadow:0 0 60px 24px rgba(255,220,120,.45);
}
.celestial.moon{
  background:radial-gradient(circle at 38% 38%, #ffffff 0%, #eef2fb 45%, rgba(220,228,245,.5) 66%, rgba(220,228,245,0) 74%);
  box-shadow:0 0 40px 12px rgba(210,224,255,.35); width:58px; height:58px;
}
.stars{ position:absolute; inset:0; opacity:0; transition:opacity 1.2s ease; }
.stars .star{
  position:absolute; width:2px; height:2px; border-radius:50%; background:#fff;
  animation:twinkle var(--tw,3.5s) ease-in-out infinite alternate;
}
@keyframes twinkle{ from{opacity:.2} to{opacity:.95} }
.clouds{ position:absolute; inset:0; }
.cloud{
  position:absolute; background:#fff; border-radius:100px; opacity:.85;
  filter:blur(1px); animation:drift linear infinite;
}
.cloud::before,.cloud::after{ content:''; position:absolute; background:#fff; border-radius:100px; }
@keyframes drift{ from{ transform:translateX(-30vw); } to{ transform:translateX(130vw); } }
.precip{ position:absolute; inset:0; }
.drop{
  position:absolute; top:-12%; width:2px; height:16px; border-radius:2px;
  background:linear-gradient(to bottom, rgba(140,170,210,0), rgba(120,150,200,.7));
  animation:fall linear infinite;
}
@keyframes fall{ to{ transform:translateY(120vh); } }
.flake{
  position:absolute; top:-6%; border-radius:50%; background:#fff; opacity:.9;
  animation:snow linear infinite;
}
@keyframes snow{ to{ transform:translateY(120vh) translateX(var(--sx,0)); } }
.flash{
  position:absolute; inset:0; background:#fff; opacity:0; mix-blend-mode:screen;
}
.flash.on{ animation:flash 1.1s ease-out; }
@keyframes flash{ 0%{opacity:0} 6%{opacity:.75} 12%{opacity:.1} 18%{opacity:.55} 30%{opacity:0} 100%{opacity:0} }
.haze{
  position:absolute; inset:0; background:rgba(226,230,236,.42);
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); opacity:0; transition:opacity 1.2s ease;
}

/* ══ 레이아웃 ══ */
.wrap{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

/* 헤더 — 하늘 위에 뜬 반투명 바 */
header.top{
  position:sticky; top:0; z-index:20;
  background:rgba(16,24,38,.58);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid rgba(255,255,255,.10);
  color:#fff;
}
.top-in{
  max-width:900px; margin:0 auto; padding:12px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.brand{ display:flex; flex-direction:column; line-height:1.12; }
.brand .kicker{ font-size:10px; letter-spacing:.24em; color:rgba(255,255,255,.62); font-weight:700; }
.brand .ttl{ font-size:19px; font-weight:800; letter-spacing:-.01em; }
.top-right{ display:flex; align-items:center; gap:8px; }
.homebtn{
  display:inline-flex; align-items:center; gap:5px; text-decoration:none;
  background:rgba(255,255,255,.15); color:#eaf1fb; border-radius:999px;
  padding:7px 13px; font-size:12px; font-weight:600; white-space:nowrap;
  transition:background .15s ease, color .15s ease;
}
.homebtn:hover{ background:#fff; color:var(--navy); }
.homebtn[hidden]{ display:none; }
.langtog{ display:inline-flex; background:rgba(255,255,255,.15); border-radius:999px; padding:3px; }
.langtog button{
  border:0; background:transparent; color:rgba(255,255,255,.78); font-weight:700; font-size:12.5px;
  padding:6px 12px; border-radius:999px; transition:.15s;
}
.langtog button.on{ background:#fff; color:var(--navy); }

main{ max-width:900px; margin:0 auto; padding:16px 18px 44px; width:100%; flex:1; }

/* 장소 선택 */
.places{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
.preset{
  border:1px solid var(--glass-line); background:var(--glass);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  color:var(--ink); font-weight:700; font-size:14px; padding:9px 15px; border-radius:999px;
  transition:.15s; box-shadow:0 2px 8px rgba(15,27,45,.06);
}
.preset:hover{ background:var(--glass-strong); }
.preset.on{ background:var(--navy); color:#fff; border-color:transparent; }
.searchbox{ position:relative; margin-bottom:16px; }
.searchbox input{
  width:100%; font-family:inherit; font-size:15px; padding:13px 17px;
  border:1px solid var(--glass-line); border-radius:var(--r-sm);
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  color:var(--ink); box-shadow:0 2px 8px rgba(15,27,45,.06);
}
.searchbox input::placeholder{ color:#7c8ca3; }
.searchbox input:focus{ outline:none; background:var(--glass-strong); box-shadow:0 0 0 3px rgba(255,255,255,.55); }
.results{
  position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:30;
  background:rgba(255,255,255,.92); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-line); border-radius:var(--r-sm);
  box-shadow:var(--shadow-lg); overflow:hidden; display:none;
}
.results.open{ display:block; }
.results button{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  padding:12px 15px; font-size:14.5px; border-bottom:1px solid rgba(15,27,45,.07);
}
.results button:last-child{ border-bottom:0; }
.results button:hover,.results button:focus{ background:rgba(15,27,45,.05); outline:none; }
.results .r-sub{ font-size:12px; color:var(--muted); }

/* 글래스 카드 공통 */
.card{
  background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--r);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow); padding:20px; margin-bottom:14px;
}
.sec-title{
  font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); margin:0 0 14px;
}

/* ══ 히어로 — 장소 · 현재 기온 · 라운딩 판정 ══ */
.hero-card{ padding:22px 22px 18px; }
.hero-place{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:2px; }
.hero-place .pn{ font-size:22px; font-weight:800; letter-spacing:-.02em; }
.hero-place .pr{ font-size:13px; color:var(--muted); font-weight:600; }

.hero-now{ display:flex; align-items:center; gap:6px; margin:6px 0 4px; }
.hero-ico{ width:96px; height:96px; flex:none; margin-left:-8px; }
.hero-temp{ font-size:76px; font-weight:250; letter-spacing:-.045em; line-height:.95; }
.hero-temp sup{ font-size:.42em; font-weight:400; vertical-align:super; margin-left:2px; }
.hero-meta{ margin-left:auto; text-align:right; }
.hero-state{ font-size:16px; font-weight:700; }
.hero-feel{ font-size:13px; color:var(--muted); font-weight:600; }
.hero-hilo{ font-size:13px; color:var(--ink-2); font-weight:700; margin-top:3px; }

/* 라운딩 판정 배너 */
.fit{
  display:flex; align-items:center; gap:14px; margin-top:16px;
  padding:14px 16px; border-radius:var(--r-sm);
  background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.7);
}
.fit-ring{ flex:none; }
.fit-body{ flex:1; min-width:0; }
.fit-when{ font-size:11.5px; font-weight:800; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; }
.fit-verdict{ display:flex; align-items:center; gap:7px; font-size:21px; font-weight:800; letter-spacing:-.02em; margin:1px 0 2px; }
.fit-flag{ display:inline-flex; }
.fit-reason{ font-size:13.5px; color:var(--ink-2); font-weight:600; }
.scale{ display:flex; gap:3px; margin-top:12px; }
.scale span{ flex:1; height:5px; border-radius:99px; opacity:.35; transition:opacity .2s; }
.scale span.on{ opacity:1; height:7px; margin-top:-1px; }
.scale-legend{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-top:5px; font-weight:600; }

/* 지표 타일 */
.metrics{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:14px; }
.metric{
  background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.65);
  border-radius:var(--r-sm); padding:11px 10px; text-align:center;
}
.metric .ml{ font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.03em; }
.metric .mv{ font-size:15px; font-weight:800; letter-spacing:-.01em; margin-top:2px; white-space:nowrap; }
.metric .mv small{ font-size:.72em; font-weight:700; color:var(--ink-2); margin-left:1px; }

/* ══ 시간대별 — 상자 없이 열로 ══ */
.hours{
  display:flex; gap:0; overflow-x:auto; padding:2px 0 8px;
  -webkit-overflow-scrolling:touch; scrollbar-width:thin;
}
.hours::-webkit-scrollbar{ height:5px; }
.hours::-webkit-scrollbar-thumb{ background:rgba(15,27,45,.16); border-radius:99px; }
.hcell{
  flex:0 0 auto; width:60px; text-align:center; padding:8px 2px 6px;
  border-radius:12px; position:relative;
}
.hcell.tee{ background:rgba(255,255,255,.52); }
.hcell.tee.tee-s{ border-top-left-radius:12px; border-bottom-left-radius:12px; }
.hcell .ht{ font-size:11.5px; color:var(--muted); font-weight:700; }
.hcell .hi{ width:34px; height:34px; margin:3px auto 1px; }
.hcell .htemp{ font-size:15px; font-weight:800; letter-spacing:-.02em; }
.hcell .hpop{ font-size:10.5px; color:#2f7fc4; font-weight:800; min-height:14px; }
.hcell .hwind{ font-size:10.5px; color:var(--muted); font-weight:600; }
.hbar{ height:4px; border-radius:99px; margin:6px 7px 0; background:rgba(15,27,45,.10); overflow:hidden; }
.hbar i{ display:block; height:100%; border-radius:99px; }
.legend{ font-size:11.5px; color:var(--muted); margin-top:6px; display:flex; align-items:center; gap:7px; font-weight:600; }
.legend .sw{ width:16px; height:10px; border-radius:4px; background:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.9); display:inline-block; }

/* ══ 7일 — 세로 리스트 + 온도 레인지 바 ══ */
.days{ display:flex; flex-direction:column; }
.drow{
  display:grid; grid-template-columns:64px 34px 46px 1fr auto; align-items:center; gap:10px;
  width:100%; border:0; background:transparent; text-align:left;
  padding:9px 10px; border-radius:var(--r-sm); transition:background .15s;
  border-bottom:1px solid rgba(15,27,45,.07);
}
.drow:last-child{ border-bottom:0; }
.drow:hover{ background:rgba(255,255,255,.45); }
.drow.on{ background:rgba(255,255,255,.78); box-shadow:0 2px 10px rgba(15,27,45,.08); }
.drow .dw{ font-size:14px; font-weight:800; }
.drow .dw .dd{ display:block; font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.01em; }
.drow .di{ width:32px; height:32px; }
.drow .dpop{ font-size:11px; color:#2f7fc4; font-weight:800; text-align:center; }
.rangewrap{ display:flex; align-items:center; gap:9px; min-width:0; }
.rlo,.rhi{ font-size:13.5px; font-weight:800; letter-spacing:-.02em; flex:none; width:32px; }
.rlo{ color:var(--muted); text-align:right; }
.range{ flex:1; height:5px; border-radius:99px; background:rgba(15,27,45,.11); position:relative; min-width:40px; }
.range i{ position:absolute; top:0; height:100%; border-radius:99px; }
.dpill{
  display:inline-block; color:#fff; font-weight:800; font-size:11.5px;
  padding:3px 9px; border-radius:99px; min-width:38px; text-align:center;
}
.dtag{
  display:inline-block; font-size:9.5px; font-weight:800; color:var(--navy);
  background:rgba(255,255,255,.85); border-radius:5px; padding:1px 5px; margin-left:5px; vertical-align:1px;
}

/* 푸터 */
footer.bot{
  background:rgba(16,24,38,.58); color:rgba(255,255,255,.72);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-top:1px solid rgba(255,255,255,.10);
}
.bot-in{
  max-width:900px; margin:0 auto; padding:15px 18px calc(18px + env(safe-area-inset-bottom,0));
  font-size:12.5px; display:flex; flex-wrap:wrap; gap:5px 18px; justify-content:center; text-align:center; font-weight:600;
}
.bot-in a{ color:rgba(255,255,255,.9); }

/* 상태 */
.state-msg{ text-align:center; padding:44px 16px; color:var(--ink-2); font-weight:600; }
.spinner{
  width:28px; height:28px; border:3px solid rgba(15,27,45,.14); border-top-color:var(--navy);
  border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* 반응형 (§11) */
@media (max-width:560px){
  main{ padding:14px 14px 36px; }
  .card{ padding:17px; border-radius:20px; }
  .hero-card{ padding:18px 18px 16px; }
  .hero-temp{ font-size:62px; }
  .hero-ico{ width:78px; height:78px; }
  .hero-state{ font-size:15px; }
  .fit-verdict{ font-size:19px; }
  .metrics{ grid-template-columns:repeat(3,1fr); }
  .metrics .metric:nth-child(4),.metrics .metric:nth-child(5){ grid-column:span 1; }
  .drow{ grid-template-columns:56px 30px 38px 1fr auto; gap:7px; padding:9px 6px; }
  .rlo,.rhi{ width:28px; font-size:13px; }
  .brand .ttl{ font-size:17px; }
  .homebtn{ padding:7px 10px; }
  .homebtn span{ display:none; }
}
@media (max-width:400px){
  .metrics{ grid-template-columns:repeat(2,1fr); }
  .hero-temp{ font-size:56px; }
}
@media (prefers-reduced-motion: reduce){
  .celestial{ transition:none; }
  .stars .star,.cloud,.drop,.flake,.flash.on{ animation:none !important; }
  .sky-gradient{ transition:none; }
}
.anim-paused .stars .star,
.anim-paused .cloud,
.anim-paused .drop,
.anim-paused .flake{ animation-play-state:paused !important; }
:focus-visible{ outline:2px solid #7cc4f2; outline-offset:2px; }
</style>
</head>
<body>

<!-- 하늘 레이어 -->
<div class="sky" id="sky" aria-hidden="true">
  <div class="sky-gradient" id="skyGrad"></div>
  <div class="stars" id="stars"></div>
  <div class="celestial sun" id="sun" style="opacity:0"></div>
  <div class="celestial moon" id="moon" style="opacity:0"></div>
  <div class="clouds" id="clouds"></div>
  <div class="haze" id="haze"></div>
  <div class="precip" id="precip"></div>
  <div class="flash" id="flash"></div>
</div>

<div class="wrap">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span class="kicker">MERITTOUR</span>
        <span class="ttl" id="appTitle">골프 날씨</span>
      </div>
      <div class="top-right">
        <a class="homebtn" id="homeBtn" href="../../sales/" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>
          </svg>
          <span id="homeBtnLabel">사내 도구함</span>
        </a>
        <div class="langtog" role="group" aria-label="언어 선택">
          <button type="button" data-lang="ko" class="on">한국어</button>
          <button type="button" data-lang="ja">日本語</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="places" id="presets"></div>
    <div class="searchbox">
      <input type="text" id="search" autocomplete="off" spellcheck="false" />
      <div class="results" id="results" role="listbox"></div>
    </div>

    <div id="content"></div>
    <div id="stateMsg" class="state-msg" style="display:none"></div>
  </main>

  <footer class="bot">
    <div class="bot-in" id="footer"></div>
  </footer>
</div>

<script>
"use strict";

/* ════════════ §12 튜닝 상수 ════════════ */
const ROUND_START = 7;     // 티타임 시작 시(포함)
const ROUND_END   = 15;    // 티타임 종료 시(미포함) → 07~14시
const SHOW_START  = 5, SHOW_END = 19;
const SKY_ENABLED     = true;
const PRECIP_MAX_RAIN = 60;
const PRECIP_MAX_SNOW = 40;
const ANIM_INTENSITY  = 'soft';   // 'soft' | 'vivid'

/* ════════════ §4 프리셋 골프장 ════════════ */

  if(!e) return { emoji:'❓', text:'—' };

/* ════════════ 날씨 아이콘 (자체 SVG · 외부 의존 없음) ════════════
   이모지는 기기·브라우저마다 모양이 제각각이라 화면이 통일되지 않는다.
   WMO 코드 → 아이콘 종류로 묶고, 낮/밤 변형만 따로 둔다. */
const ICON_KIND = code => {
  if(code===0) return 'clear';
  if(code===1) return 'mostly';
  if(code===2) return 'partly';
  if(code===3) return 'cloudy';
  if(code===45||code===48) return 'fog';
  if(code>=51&&code<=57) return 'drizzle';
  if(code>=61&&code<=67) return 'rain';
  if((code>=71&&code<=77)||code===85||code===86) return 'snow';
  if(code>=80&&code<=82) return 'showers';
  if(code>=95) return 'thunder';
  return 'cloudy';
};
/* 부품 */
const _SUN = (cx,cy,r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gwSun)"/>`;
const _RAYS = (cx,cy,r) => {
  let d='';
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, x1=cx+Math.cos(a)*(r+3.2), y1=cy+Math.sin(a)*(r+3.2);
    const x2=cx+Math.cos(a)*(r+7.4), y2=cy+Math.sin(a)*(r+7.4);
    d+=`M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
  }
  return `<path d="${d}" stroke="#f7b733" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;
};
const _MOON = (cx,cy,r) =>
  `<path d="M${cx+r*.55} ${cy-r} a${r} ${r} 0 1 0 ${r*.72} ${r*1.5} a${r*.86} ${r*.86} 0 1 1 ${-r*.72} ${-r*1.5}z" fill="url(#gwMoon)"/>`;
const _CLOUD = (x,y,sc,fill) =>
  `<g transform="translate(${x} ${y}) scale(${sc})"><path d="M18 30h26a11 11 0 0 0 1.6-21.9A15 15 0 0 0 17 5.6 12 12 0 0 0 18 30z" fill="${fill}"/></g>`;
const _DROPS = (n,y) => {
  let g='';
  for(let i=0;i<n;i++) g+=`<path d="M${17+i*11} ${y}l-2.6 6.4a2.9 2.9 0 1 0 5.2 0z" fill="#57a5e6"/>`;
  return g;
};
const _FLAKES = n => {
  let g='';
  for(let i=0;i<n;i++){ const x=18+i*11, y=50;
    g+=`<g stroke="#8fc7f0" stroke-width="2" stroke-linecap="round"><path d="M${x} ${y-3.4}v6.8M${x-3} ${y-1.7}l6 3.4M${x-3} ${y+1.7}l6-3.4"/></g>`; }
  return g;
};
const _BOLT = `<path d="M33 41l-9 13h6.6l-2.4 10 10-14h-6.8z" fill="#f7b733"/>`;

/* 크기 s(px)의 아이콘 SVG 문자열. night=true면 해→달. */
function wxIcon(code, s, night){
  const k = ICON_KIND(code);
  const defs = `<defs>
    <linearGradient id="gwSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd75e"/><stop offset="1" stop-color="#f7a72e"/></linearGradient>
    <linearGradient id="gwMoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfdff"/><stop offset="1" stop-color="#d9e2f5"/></linearGradient>
    <linearGradient id="gwC1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe8f3"/></linearGradient>
    <linearGradient id="gwC2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d5e4"/><stop offset="1" stop-color="#a7b7cc"/></linearGradient>
  </defs>`;
  let g='';
  const orb = (cx,cy,r) => night ? _MOON(cx,cy,r) : (_RAYS(cx,cy,r)+_SUN(cx,cy,r));
  switch(k){
    case 'clear':   g = orb(40,40,night?14:13); break;
    case 'mostly':  g = orb(33,31,11) + _CLOUD(20,32,1.02,'url(#gwC1)'); break;
    case 'partly':  g = orb(30,28,10) + _CLOUD(16,30,1.18,'url(#gwC1)'); break;
    case 'cloudy':  g = _CLOUD(26,16,.86,'url(#gwC2)') + _CLOUD(12,28,1.22,'url(#gwC1)'); break;
    case 'fog':     g = _CLOUD(14,20,1.2,'url(#gwC1)') +
      `<g stroke="#b6c4d6" stroke-width="3.4" stroke-linecap="round"><path d="M16 56h48M22 64h36"/></g>`; break;
    case 'drizzle': g = _CLOUD(14,14,1.2,'url(#gwC1)') + _DROPS(3,46); break;
    case 'rain':    g = _CLOUD(14,12,1.2,'url(#gwC2)') + _DROPS(4,45); break;
    case 'showers': g = orb(30,22,9) + _CLOUD(14,18,1.16,'url(#gwC1)') + _DROPS(3,48); break;
    case 'snow':    g = _CLOUD(14,12,1.2,'url(#gwC1)') + _FLAKES(4); break;
    case 'thunder': g = _CLOUD(14,10,1.22,'url(#gwC2)') + _BOLT + _DROPS(2,44); break;
    default:        g = _CLOUD(14,24,1.2,'url(#gwC1)');
  }
  return `<svg viewBox="0 0 80 80" width="${s}" height="${s}" aria-hidden="true" focusable="false">${defs}${g}</svg>`;
}
/* 기온 → 색. 주간 최저~최고 구간에서의 위치로 시원함→따뜻함을 잇는다.
   바마다 같은 그라데이션을 쓰면 추운 날도 주황으로 보여 오해를 준다. */
function tempColor(v, lo, hi){
  const p = Math.max(0, Math.min(1, (v - lo) / Math.max(1, hi - lo)));
  const A = [74,163,224], B = [245,196,81], C = [239,125,47];   // 시원 → 온화 → 더움
  const [x,y,k] = p<0.5 ? [A,B,p*2] : [B,C,(p-0.5)*2];
  return `rgb(${x.map((v0,i)=>Math.round(v0+(y[i]-v0)*k)).join(',')})`;
}

/* 그 시각이 밤인가 — 일출/일몰 기준 (없으면 시각으로 대충) */
function isNightAt(hour, dayIdx){
  try{
    const sr = DATA.daily.sunrise[dayIdx], ss = DATA.daily.sunset[dayIdx];
    if(sr && ss){
      // 분까지 본다. 시만 비교하면 일출 05:24일 때 05시가 낮으로 잘못 잡힌다.
      const now = hour*60;
      return now < hmMin(sr) || now >= hmMin(ss);
    }
  }catch(e){}
  return hour < 6 || hour >= 19;
}

/* ════════════ §6.3 판정 밴드 ════════════ */
const VERDICT_COLORS = ['#1b7a3d','#3aa856','#e0a100','#e2620c','#c0392b'];
function verdictIndex(score){
  if(score>=85) return 0;
  if(score>=70) return 1;
  if(score>=50) return 2;
  if(score>=30) return 3;
  return 4;
}
const verdictColor = score => VERDICT_COLORS[verdictIndex(score)];
const verdictText  = (score, lang) => I18N[lang].verdicts[verdictIndex(score)];

/* ════════════ §6.1 시간별 점수 ════════════ */
function scoreHour(h){
  // h: { code, pop, precip, wind, gust, temp, uv, vis }
  let s = 100;
  const pen = {};   // 카테고리별 감점 누적
  const add = (cat, v) => { if(v>0){ pen[cat] = (pen[cat]||0) + v; s -= v; } };

  if(isThunder(h.code)) add('storm', 60);

  const pop = h.pop ?? 0;
  if(pop>=70) add('rain',45); else if(pop>=50) add('rain',28); else if(pop>=30) add('rain',14); else if(pop>=15) add('rain',5);

  const pr = h.precip ?? 0;
  if(pr>=4) add('rain',40); else if(pr>=1) add('rain',20); else if(pr>=0.2) add('rain',8);

  const w = h.wind ?? 0;
  if(w>=10) add('wind',35); else if(w>=7) add('wind',20); else if(w>=5) add('wind',10); else if(w>=4) add('wind',4);

  const g = h.gust ?? 0;
  if(g>=13) add('wind',10);

  const t = h.temp;
  if(t!=null){
    if(t>=35) add('heat',30); else if(t>=33) add('heat',18); else if(t>=30) add('heat',8);
    if(t<=0) add('cold',28); else if(t<=3) add('cold',16); else if(t<=6) add('cold',7);
  }

  const uv = h.uv ?? 0;
  if(uv>=8) add('uv',8); else if(uv>=6) add('uv',4);

  const v = h.vis;
  if(v!=null){
    if(v<1000) add('vis',15); else if(v<3000) add('vis',6);
  }

  return { score: Math.max(0, Math.min(100, s)), pen };
}

/* ════════════ §6.2 / §6.4 하루 종합 ════════════ */
function scoreDay(hoursOfDay, lang){
  // hoursOfDay: 24개(또는 가용) 시간 객체 배열 (index = 시). 라운딩 구간만 사용.
  const win = [];
  for(let hr=ROUND_START; hr<ROUND_END; hr++){
    if(hoursOfDay[hr]) win.push(hoursOfDay[hr]);
  }
  if(!win.length) return { score:0, color:verdictColor(0), verdict:verdictText(0,lang), reason:I18N[lang].reasonNone };

  const penTotal = {};
  let sum = 0, hasStorm = false;
  let maxPop = 0, maxWind = 0, maxTemp = -999, minTemp = 999;

  win.forEach(h => {
    const r = scoreHour(h);
    sum += r.score;
    for(const k in r.pen) penTotal[k] = (penTotal[k]||0) + r.pen[k];
    if(isThunder(h.code)) hasStorm = true;
    maxPop = Math.max(maxPop, h.pop ?? 0);
    maxWind = Math.max(maxWind, h.wind ?? 0);
    if(h.temp!=null){ maxTemp = Math.max(maxTemp, h.temp); minTemp = Math.min(minTemp, h.temp); }
  });

  let score = Math.round(sum / win.length);
  if(hasStorm) score = Math.min(score, 22);   // 안전 우선 캡

  // 대표 사유: 누적 감점 최대 카테고리
  let topCat = null, topVal = 0;
  for(const k in penTotal){ if(penTotal[k] > topVal){ topVal = penTotal[k]; topCat = k; } }

  const t = I18N[lang];
  let reason;
  if(!topCat){
    reason = t.reasonNone;
  } else {
    reason = t.reason[topCat] || '';
    if(topCat==='rain' || topCat==='storm') reason += ` (${t.poplabel} ${maxPop}${t.uProb})`;
    else if(topCat==='wind') reason += ` (${t.maxwind} ${Math.round(maxWind)}${t.uWind})`;
    else if(topCat==='heat') reason += ` (${Math.round(maxTemp)}${t.uTemp})`;
    else if(topCat==='cold') reason += ` (${Math.round(minTemp)}${t.uTemp})`;
  }

  return { score, color:verdictColor(score), verdict:verdictText(score,lang), reason };
}

function hmMin(iso){ if(!iso) return 0; const t = iso.slice(11,16).split(':'); return (+t[0])*60 + (+t[1]); }
function hourOf(iso){ return +iso.slice(11,13); }
function dateKey(iso){ return iso.slice(0,10); }

/* ════════════ API (§3) ════════════ */
async function loadForecast(place){
  showState(I18N[LANG].loading, true);
  const p = new URLSearchParams({
    latitude:place.lat, longitude:place.lon, timezone:'auto', forecast_days:'7', wind_speed_unit:'ms',
    current:'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    hourly:'temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,visibility,uv_index,relative_humidity_2m',
    daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,uv_index_max,sunrise,sunset',
  });
  if(place.elevation!=null) p.set('elevation', place.elevation);
  try{
    const res = await fetch('https://api.open-meteo.com/v1/forecast?'+p.toString());
    if(!res.ok) throw new Error('http '+res.status);
    DATA = await res.json();
    CUR_PLACE = place;
    SEL_DAY = 0;
    hideState();
    renderAll();
    window.scrollTo({ top:0, behavior:'smooth' });
  }catch(e){
    showState(I18N[LANG].errLoad, false);
  }
}

async function geoSearch(q){
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${LANG}&format=json`;
  try{
    const res = await fetch(url);
    const j = await res.json();
    return j.results || [];
  }catch(e){ return []; }
}

/* ════════════ hourly → 일자별 시간표 ════════════ */
function hoursForDay(dayIdx){
  // DATA.hourly.time 에서 해당 날짜의 시간들을 시(hour) 인덱스로 매핑
  const H = DATA.hourly, out = {};
  const targetDate = DATA.daily.time[dayIdx];
  for(let i=0;i<H.time.length;i++){
    if(dateKey(H.time[i]) !== targetDate) continue;
    const hr = hourOf(H.time[i]);
    out[hr] = {
      iso:H.time[i], code:H.weather_code[i],
      temp:H.temperature_2m[i], feel:H.apparent_temperature[i],
      pop:H.precipitation_probability[i] ?? 0, precip:H.precipitation[i] ?? 0,
      wind:H.wind_speed_10m[i] ?? 0, gust:H.wind_gusts_10m[i] ?? 0, wdir:H.wind_direction_10m[i] ?? 0,
      vis:H.visibility[i], uv:H.uv_index[i] ?? 0, humid:H.relative_humidity_2m[i] ?? 0,
    };
  }
  return out;
}
// 현재 시각 hourly 인덱스(자외선·시정 보완용)
function currentHourExtra(){
  const H = DATA.hourly, key = (DATA.current.time||'').slice(0,13);
  for(let i=0;i<H.time.length;i++){
    if(H.time[i].slice(0,13)===key) return { uv:H.uv_index[i] ?? 0, vis:H.visibility[i] };
  }
  return { uv:0, vis:null };
}

  const extra = currentHourExtra();
  const cw = wmo(cur.weather_code, LANG);

  const dayHours = hoursForDay(SEL_DAY);
  const dayEval = scoreDay(dayHours, LANG);

  const visTxt = v => v==null ? '—' : (v/1000).toFixed(v<10000?1:0)+' '+t.uVis;

  // 날짜 라벨
  const dLabel = idx => {
    if(idx===0) return t.today;
    if(idx===1) return t.tomorrow;
    const iso = DATA.daily.time[idx];
    const wd = t.wdays[ new Date(iso+'T00:00').getDay() ];
    return `${iso.slice(5).replace('-','/')} (${wd})`;
  };

  let html = '';
  const D = DATA.daily;
  const nowH = +(cur.time||'').slice(11,13);

  // ══ ① 히어로 — 장소 · 현재 기온 · 라운딩 판정 · 지표 ══
  html += `<div class="card hero-card">
    <div class="hero-place">
      <span class="pn">${esc(place.name)}</span>
      <span class="pr">${esc(place.region||'')}</span>
    </div>
    <div class="hero-now">
      <div class="hero-ico">${wxIcon(cur.weather_code, 96, isNightAt(nowH, 0))}</div>
      <div class="hero-temp">${Math.round(cur.temperature_2m)}<sup>°</sup></div>
      <div class="hero-meta">
        <div class="hero-state">${cw.text}</div>
        <div class="hero-feel">${t.feels} ${Math.round(cur.apparent_temperature)}°</div>
        <div class="hero-hilo">${Math.round(D.temperature_2m_max[0])}° / <span style="color:var(--muted)">${Math.round(D.temperature_2m_min[0])}°</span></div>
      </div>
    </div>

    <div class="fit">
      <div class="fit-ring">${gaugeSVG(dayEval.score, dayEval.color)}</div>
      <div class="fit-body">
        <div class="fit-when">${dLabel(SEL_DAY)} · ${t.fitTitle}</div>
        <div class="fit-verdict" style="color:${dayEval.color}">
          <span class="fit-flag">${flagSVG(dayEval.color)}</span>${dayEval.verdict}
        </div>
        <div class="fit-reason">${esc(dayEval.reason)}</div>
        <div class="scale">${VERDICT_COLORS.map((col,i)=>`<span class="${i===verdictIndex(dayEval.score)?'on':''}" style="background:${col}"></span>`).join('')}</div>
        <div class="scale-legend"><span>${t.verdicts[0]}</span><span>${t.verdicts[4]}</span></div>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="ml">${t.wind}</div><div class="mv">${cur.wind_speed_10m.toFixed(1)}<small>${t.uWind}</small></div></div>
      <div class="metric"><div class="ml">${t.gust}</div><div class="mv">${(cur.wind_gusts_10m??0).toFixed(1)}<small>${t.uWind}</small></div></div>
      <div class="metric"><div class="ml">${t.humid}</div><div class="mv">${cur.relative_humidity_2m}<small>%</small></div></div>
      <div class="metric"><div class="ml">${t.uv}</div><div class="mv">${Math.round(extra.uv)}</div></div>
      <div class="metric"><div class="ml">${t.vis}</div><div class="mv">${visTxt(extra.vis)}</div></div>
    </div>
  </div>`;

  // ══ ② 시간대별 ══
  let cells = '';
  for(let hr=SHOW_START; hr<=SHOW_END; hr++){
    const h = dayHours[hr];
    if(!h) continue;
    const r = scoreHour(h);
    const tee = (hr>=ROUND_START && hr<ROUND_END) ? ' tee' : '';
    const pop = h.pop>=10 ? `${h.pop}%` : '';
    cells += `<div class="hcell${tee}">
      <div class="ht">${String(hr).padStart(2,'0')}</div>
      <div class="hi">${wxIcon(h.code, 34, isNightAt(hr, SEL_DAY))}</div>
      <div class="htemp">${Math.round(h.temp)}°</div>
      <div class="hpop">${pop}</div>
      <div class="hwind">${h.wind.toFixed(1)}</div>
      <div class="hbar"><i style="width:${r.score}%;background:${verdictColor(r.score)}"></i></div>
    </div>`;
  }
  html += `<div class="card"><div class="sec-title">${t.hourly}</div>
    <div class="hours">${cells}</div>
    <div class="legend"><span class="sw"></span>${t.teeLegend}</div></div>`;

  // ══ ③ 7일 — 세로 리스트 + 온도 레인지 바 ══
  const wkLo = Math.min(...D.temperature_2m_min), wkHi = Math.max(...D.temperature_2m_max);
  const wkSpan = Math.max(1, wkHi - wkLo);
  let rows = '';
  for(let i=0;i<D.time.length;i++){
    const ev = scoreDay(hoursForDay(i), LANG);
    const iso = D.time[i];
    const wd = t.wdays[ new Date(iso+'T00:00').getDay() ];
    const tag = i===0 ? t.today : (i===1 ? t.tomorrow : '');
    const lo = D.temperature_2m_min[i], hi = D.temperature_2m_max[i];
    const left = ((lo - wkLo)/wkSpan*100).toFixed(1);
    const width = Math.max(6, (hi - lo)/wkSpan*100).toFixed(1);
    const pop = D.precipitation_probability_max[i] ?? 0;
    rows += `<button type="button" class="drow${i===SEL_DAY?' on':''}" data-day="${i}">
      <span class="dw">${wd}${tag?`<span class="dtag">${tag}</span>`:''}<span class="dd">${iso.slice(5).replace('-','/')}</span></span>
      <span class="di">${wxIcon(D.weather_code[i], 32, false)}</span>
      <span class="dpop">${pop>=10?pop+'%':''}</span>
      <span class="rangewrap">
        <span class="rlo">${Math.round(lo)}°</span>
        <span class="range"><i style="left:${left}%;width:${width}%;background:linear-gradient(90deg,${tempColor(lo,wkLo,wkHi)},${tempColor(hi,wkLo,wkHi)})"></i></span>
        <span class="rhi">${Math.round(hi)}°</span>
      </span>
      <span class="dpill" style="background:${ev.color}">${ev.score}</span>
    </button>`;
  }
  html += `<div class="card"><div class="sec-title">${t.week}</div><div class="days">${rows}</div></div>`;

  c.innerHTML = html;

  // 7일 카드 클릭 → SEL_DAY 갱신
  c.querySelectorAll('.drow').forEach(btn => {
    btn.addEventListener('click', () => {
      SEL_DAY = +btn.dataset.day;
      renderAll();
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  });

  renderFooter();
  updateSky();
}

function renderFooter(){
  const t = I18N[LANG], D = DATA.daily;
  const sr = (D.sunrise[SEL_DAY]||'').slice(11,16);
  const ss = (D.sunset[SEL_DAY]||'').slice(11,16);
  const upd = (DATA.current.time||'').slice(11,16);
  const arc = up => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px">
    <path d="M3 18h18M12 4v6"/><path d="${up?'M8.5 7.5 12 4l3.5 3.5':'M8.5 6.5 12 10l3.5-3.5'}"/>
    <path d="M6 18a6 6 0 0 1 12 0"/></svg>`;
  $('footer').innerHTML =
    `<span>${arc(true)}${t.sunrise} ${sr}</span><span>${arc(false)}${t.sunset} ${ss}</span>` +
    `<span><a href="https://open-meteo.com/" target="_blank" rel="noopener">${t.source}</a></span>` +
    `<span>${t.updated} ${upd}</span>`;
}

/* 원형 게이지 SVG (§5.2) */
function gaugeSVG(score, color){
  const R = 30, C = 2*Math.PI*R, off = C*(1 - score/100);
  return `<svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="${score} / 100">
    <circle cx="38" cy="38" r="${R}" fill="none" stroke="rgba(15,27,45,.10)" stroke-width="7"/>
    <circle cx="38" cy="38" r="${R}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 38 38)"/>
    <text x="38" y="43" text-anchor="middle" font-size="24" font-weight="800" fill="${color}"
      font-family="Pretendard,-apple-system,system-ui,sans-serif" letter-spacing="-1">${score}</text>
  </svg>`;
}
/* 골프 깃대 아이콘 */
function flagSVG(color){
  return `<svg width="19" height="21" viewBox="0 0 22 24" aria-hidden="true">
    <path d="M5 22 L5 2" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    <path d="M5 3 L17 6 L5 10 Z" fill="${color}"/>
    <circle cx="5" cy="22" r="2" fill="${color}"/>
  </svg>`;
}

/* ════════════ 상태 표시 ════════════ */
function showState(msg, spin){
  $('content').innerHTML = '';
  const el = $('stateMsg');
  el.style.display = 'block';
  el.innerHTML = (spin?'<div class="spinner"></div>':'') + esc(msg);
}
function hideState(){ $('stateMsg').style.display = 'none'; }

/* ════════════ §10 하늘 애니메이션 ════════════ */
function skyPhase(nowMin, srMin, ssMin){
  const dawnStart = srMin - 30, dawnEnd = srMin + 60;
  const goldenStart = ssMin - 75, goldenEnd = ssMin + 45;
  if(nowMin < dawnStart)      return 'night';
  if(nowMin < dawnEnd)        return 'dawn';
  if(nowMin < 720)            return 'morning';
  if(nowMin < goldenStart)    return 'midday';
  if(nowMin < goldenEnd)      return 'golden';
  return 'night';
}
const SKY_GRAD = {
  dawn:['#f7c9c9','#ffe3c2'], morning:['#bfe3ff','#eaf6ff'], midday:['#7cc4f2','#cfeaff'],
  golden:['#ff9e6d','#ffd29e'], night:['#1a2340','#2b3a63'],
};
function updateSky(){
  if(!SKY_ENABLED || !DATA) return;
  const cur = DATA.current;
  const srMin = hmMin(DATA.daily.sunrise[0]);
  const ssMin = hmMin(DATA.daily.sunset[0]);
  const nowMin = hmMin(cur.time);
  const phase = skyPhase(nowMin, srMin, ssMin);
  const code = cur.weather_code;

  document.body.dataset.phase = phase;   // 어두운 하늘에서는 유리를 더 불투명하게 (CSS)

  const key = phase + '|' + code;
  if(key === lastSkyKey){ positionCelestial(phase, nowMin, srMin, ssMin); return; }
  lastSkyKey = key;

  // 그라데이션
  const g = SKY_GRAD[phase];
  document.documentElement.style.setProperty('--sky-top', g[0]);
  document.documentElement.style.setProperty('--sky-bot', g[1]);

  // 별
  const isNight = phase==='night';
  $('stars').style.opacity = isNight ? '1' : '0';
  if(isNight && !$('stars').dataset.built){ buildStars(); $('stars').dataset.built = '1'; }

  positionCelestial(phase, nowMin, srMin, ssMin);
  buildWeatherOverlay(code, phase);
}
function positionCelestial(phase, nowMin, srMin, ssMin){
  const sun = $('sun'), moon = $('moon');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isNight = phase==='night';
  if(isNight){
    sun.style.opacity = '0';
    // 달 아크
    let denom = (srMin + 1440) - ssMin;
    let p = nowMin >= ssMin ? (nowMin - ssMin)/denom : (nowMin + 1440 - ssMin)/denom;
    p = clampN(p, 0, 1);
    moon.style.opacity = '1';
    moon.style.setProperty('--cx', (8 + p*84) + '%');
    moon.style.setProperty('--cy', reduce ? '18%' : (78 - Math.sin(p*Math.PI)*62) + '%');
  } else {
    moon.style.opacity = '0';
    let p = clampN((nowMin - srMin)/Math.max(1,(ssMin - srMin)), 0, 1);
    sun.style.opacity = '1';
    sun.style.setProperty('--cx', (8 + p*84) + '%');
    sun.style.setProperty('--cy', reduce ? '16%' : (80 - Math.sin(p*Math.PI)*66) + '%');
  }
}
function buildStars(){
  const box = $('stars');
  let h = '';
  // 결정적 배치(Math.random 지양은 아니나 1회 생성이라 무해) — 고정 시드 느낌으로 분산
  for(let i=0;i<60;i++){
    const x = (i*37 % 100), y = (i*53 % 70), tw = 2.4 + (i%5)*0.6, d = (i%7)*0.4;
    h += `<span class="star" style="left:${x}%;top:${y}%;--tw:${tw}s;animation-delay:${d}s"></span>`;
  }
  box.innerHTML = h;
}
function buildWeatherOverlay(code, phase){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clouds = $('clouds'), precip = $('precip'), haze = $('haze'), flash = $('flash');
  clouds.innerHTML = ''; precip.innerHTML = ''; haze.style.opacity = '0';
  stopFlash();
  if(reduce) return;

  const vivid = ANIM_INTENSITY==='vivid';

  // 구름
  let nClouds = 0;
  if(code===2) nClouds = 2; else if(code===3) nClouds = 4;
  else if((code>=45&&code<=48)) nClouds = 2;
  else if((code>=51&&code<=67)||(code>=80&&code<=82)||isThunder(code)) nClouds = 3;
  else if(code>=71&&code<=86) nClouds = 3;
  for(let i=0;i<nClouds;i++) clouds.appendChild(makeCloud(i, phase));

  // 안개
  if(code===45||code===48) haze.style.opacity = '1';

  // 강수
  const rainCodes = ((code>=51&&code<=67)||(code>=80&&code<=82)||isThunder(code));
  const snowCodes = (code>=71&&code<=77)||code===85||code===86;
  if(rainCodes){
    let n = 30;
    if(code===55||code===65||code===82||code===67) n = PRECIP_MAX_RAIN;
    else if(code===63||code===81||isThunder(code)) n = Math.round(PRECIP_MAX_RAIN*0.8);
    else if(code===53||code===61||code===80) n = Math.round(PRECIP_MAX_RAIN*0.5);
    else n = Math.round(PRECIP_MAX_RAIN*0.35);
    if(vivid) n = Math.min(PRECIP_MAX_RAIN, Math.round(n*1.3));
    for(let i=0;i<n;i++) precip.appendChild(makeDrop(i));
  } else if(snowCodes){
    let n = (code===75||code===86) ? PRECIP_MAX_SNOW : Math.round(PRECIP_MAX_SNOW*0.6);
    for(let i=0;i<n;i++) precip.appendChild(makeFlake(i));
  }

  // 뇌우 번개
  if(isThunder(code)) startFlash();
}
function makeCloud(i, phase){
  const el = document.createElement('div');
  el.className = 'cloud';
  const w = 90 + (i*40 % 120), h = w*0.32;
  const top = 6 + (i*17 % 30), dur = 60 + (i*13 % 50), delay = -(i*11 % 40);
  el.style.width = w+'px'; el.style.height = h+'px';
  el.style.top = top+'%'; el.style.left = '0';
  el.style.animationDuration = dur+'s'; el.style.animationDelay = delay+'s';
  if(phase==='night'){ el.style.background='#4a5578'; el.style.opacity='.5'; }
  el.innerHTML = `<style></style>`; el.innerHTML='';
  el.style.setProperty('box-shadow', `${w*0.28}px ${h*0.35}px 0 ${w*0.02}px #fff, ${w*0.55}px ${h*0.12}px 0 ${-w*0.04}px #fff`);
  return el;
}
function makeDrop(i){
  const el = document.createElement('div');
  el.className = 'drop';
  el.style.left = (i*100/PRECIP_MAX_RAIN + (i%3))%100 + '%';
  el.style.animationDuration = (0.5 + (i%5)*0.12) + 's';
  el.style.animationDelay = -((i%9)*0.2) + 's';
  el.style.opacity = 0.4 + (i%4)*0.15;
  return el;
}
function makeFlake(i){
  const el = document.createElement('div');
  el.className = 'flake';
  const sz = 4 + (i%4)*2;
  el.style.width = sz+'px'; el.style.height = sz+'px';
  el.style.left = (i*100/PRECIP_MAX_SNOW + (i%5))%100 + '%';
  el.style.animationDuration = (5 + (i%6)) + 's';
  el.style.animationDelay = -((i%8)*0.7) + 's';
  el.style.setProperty('--sx', ((i%2?1:-1)*(10 + i%14)) + 'px');
  return el;
}
let flashTimer = null;
function startFlash(){
  stopFlash();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  const tick = () => {
    const f = $('flash');
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    flashTimer = setTimeout(tick, 4000 + (Date.now()%3000));
  };
  flashTimer = setTimeout(tick, 2500);
}
function stopFlash(){ if(flashTimer){ clearTimeout(flashTimer); flashTimer = null; } $('flash').classList.remove('on'); }

/* 탭 비활성 시 애니메이션 일시정지 */
document.addEventListener('visibilitychange', () => {
  document.body.classList.toggle('anim-paused', document.hidden);
  if(document.hidden) stopFlash();
  else if(DATA && isThunder(DATA.current.weather_code)) startFlash();
});

/* ════════════ 언어 · 프리셋 · 검색 ════════════ */
function courseName(c){ return LANG==='ja'? c.ja : c.ko; }
function courseRegion(c){ return LANG==='ja'? c.regionJa : c.regionKo; }

function renderPresets(){
  const box = $('presets');
  box.innerHTML = '';
  COURSES.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'preset';
    b.textContent = courseName(c);
    if(CUR_PLACE && CUR_PLACE.id===c.id) b.classList.add('on');
    b.addEventListener('click', () => {
      loadForecast({ id:c.id, name:courseName(c), region:courseRegion(c), lat:c.lat, lon:c.lon, elevation:c.elevation });
      renderPresets();
    });
    box.appendChild(b);
  });
}

function applyLang(){
  const t = I18N[LANG];
  document.documentElement.lang = LANG;
  $('appTitle').textContent = t.title;
  $('homeBtnLabel').textContent = t.home;
  $('search').placeholder = t.searchPh;
  document.querySelectorAll('.langtog button').forEach(b => b.classList.toggle('on', b.dataset.lang===LANG));
  renderPresets();
  if(DATA) renderAll();
}

function initEvents(){
  document.querySelectorAll('.langtog button').forEach(b => {
    b.addEventListener('click', () => { LANG = b.dataset.lang; lastSkyKey=''; applyLang(); });
  });

  const input = $('search'), results = $('results');
  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(searchTimer);
    if(q.length < 2){ results.classList.remove('open'); results.innerHTML=''; return; }
    searchTimer = setTimeout(async () => {
      const list = await geoSearch(q);
      if(!list.length){
        results.innerHTML = `<button type="button" disabled style="color:var(--muted)">${I18N[LANG].noResult}</button>`;
        results.classList.add('open'); return;
      }
      results.innerHTML = list.map((r,i) =>
        `<button type="button" role="option" data-i="${i}">
          <div>${esc(r.name)}</div>
          <div class="r-sub">${esc([r.admin1, r.country].filter(Boolean).join(', '))}</div>
        </button>`).join('');
      results.classList.add('open');
      results.querySelectorAll('button[data-i]').forEach(btn => {
        btn.addEventListener('click', () => {
          const r = list[+btn.dataset.i];
          results.classList.remove('open'); input.value = r.name;
          loadForecast({ name:r.name, region:[r.admin1, r.country].filter(Boolean).join(', '),
                         lat:r.latitude, lon:r.longitude, elevation:r.elevation });
          renderPresets();
        });
      });
    }, 300);
  });
  // 바깥 클릭 시 닫힘
  document.addEventListener('click', e => {
    if(!e.target.closest('.searchbox')) results.classList.remove('open');
  });
}

/* ════════════ 부팅 ════════════ */
/* 홈 버튼 노출 판정 — 사내 유입일 때만.
   golfweather는 손님 공개용이라 링크를 직접 받은 손님에게는 내부 허브 링크를 보이지 않는다.
   판정은 리퍼러(같은 오리진) 또는 ?home=1 로만 한다 — 브라우저 스토리지는 쓰지 않는다. */
function setupHomeBtn(){
  const btn = $('homeBtn'); if(!btn) return;
  let internal = false;
  try{
    if(new URLSearchParams(location.search).has('home')) internal = true;
    else if(document.referrer){
      const ref = new URL(document.referrer);
      if(ref.origin === location.origin) internal = true;
    }
  }catch(e){ internal = false; }
  if(internal) btn.removeAttribute('hidden');
}

function boot(){
  initEvents();
  setupHomeBtn();
  applyLang();
  const c = COURSES.find(x => x.id===DEFAULT_COURSE) || COURSES[0];
  loadForecast({ id:c.id, name:courseName(c), region:courseRegion(c), lat:c.lat, lon:c.lon, elevation:c.elevation });
  renderPresets();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* 테스트 훅(스모크용) — 브라우저 동작엔 영향 없음 */
if(typeof module!=='undefined' && module.exports){
  module.exports = { scoreHour, scoreDay, verdictIndex, skyPhase, isThunder };
}
