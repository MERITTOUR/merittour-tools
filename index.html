<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MERITTOUR Internal</title>
<link rel="stylesheet" href="shared/core.css">
<meta name="robots" content="noindex, nofollow" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }


body, body * { transition: background-color .25s, border-color .25s, color .15s; }
html, body {
  font-family: var(--mt-sans);
  background: var(--mt-bg);
  color: var(--mt-text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.wrap {
  max-width: 480px;
  width: 100%;
  text-align: center;
  background: var(--mt-surface);
  border: 1px solid var(--mt-border);
  border-radius: 16px;
  padding: 48px 36px 36px;
  box-shadow: 0 2px 12px rgba(26, 35, 50, 0.06);
}
.brand {
  font-size: 28px;
  font-weight: 700;
  color: var(--mt-brand);
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.sub {
  font-size: 11px;
  color: var(--mt-text3);
  font-family: var(--mt-mono);
  letter-spacing: 0.1em;
  margin-bottom: 36px;
}
.message {
  font-size: 15px;
  color: var(--mt-text);
  line-height: 1.7;
  margin-bottom: 24px;
}
.message strong { color: var(--mt-accent); font-weight: 600; }
.footer {
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--mt-border);
  font-size: 12px;
  color: var(--mt-text3);
  font-family: var(--mt-mono);
  letter-spacing: 0.05em;
}
.theme-toggle {
  position: fixed;
  top: 16px; right: 16px;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--mt-surface);
  border: 1px solid var(--mt-border);
  color: var(--mt-text2);
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}
.theme-toggle:hover { border-color: var(--mt-accent); color: var(--mt-accent); }
</style>
</head>
<body>



<div class="wrap">
  <div class="brand">MERITTOUR</div>
  <div class="sub">INTERNAL · 사내 전용</div>
  <div class="message">
    이 페이지는 <strong>메리트투어 사내 직원 전용</strong>입니다.<br>
    담당 부서별 도구함 URL로 접속해 주세요.
  </div>
  <div class="footer">
    문의 · 02-365-9800
  </div>
</div>

<script>
</script>
</body>
</html>
