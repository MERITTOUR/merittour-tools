<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MERITTOUR Internal</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --brand: #1a2332;
  --accent: #2563EB;
  --text: #1E2A45;
  --text2: #4A5A80;
  --text3: #8A97B8;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
}
body.dark {
  --bg: #0C0F1A;
  --surface: #12172A;
  --border: #263050;
  --brand: #FFFFFF;
  --accent: #60A5FA;
  --text: #DDE3F0;
  --text2: #7B87A8;
  --text3: #4A5268;
}
body, body * { transition: background-color .25s, border-color .25s, color .15s; }
html, body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.wrap {
  max-width: 480px;
  width: 100%;
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 48px 36px 36px;
  box-shadow: 0 2px 12px rgba(26, 35, 50, 0.06);
}
.brand {
  font-size: 28px;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.sub {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
  letter-spacing: 0.1em;
  margin-bottom: 36px;
}
.message {
  font-size: 15px;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 24px;
}
.message strong { color: var(--accent); font-weight: 600; }
.footer {
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text3);
  font-family: var(--mono);
  letter-spacing: 0.05em;
}
.theme-toggle {
  position: fixed;
  top: 16px; right: 16px;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text2);
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle"><span id="themeIcon">🌙</span></button>

<div class="wrap">
  <div class="brand">MERITTOUR</div>
  <div class="sub">INTERNAL · 사내 전용</div>
  <div class="message">
    이 페이지는 <strong>메리트투어 사내 직원 전용</strong>입니다.<br>
    담당 부서별 도구함 URL로 접속해 주세요.
  </div>
  <div class="footer">
    문의 · 02-365-9800
  </div>
</div>

<script>
const t = document.getElementById('themeToggle');
const i = document.getElementById('themeIcon');
if (localStorage.getItem('mt_theme') === 'dark') { document.body.classList.add('dark'); i.textContent = '☀️'; }
t.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const d = document.body.classList.contains('dark');
  i.textContent = d ? '☀️' : '🌙';
  localStorage.setItem('mt_theme', d ? 'dark' : 'light');
});
</script>
</body>
</html>
