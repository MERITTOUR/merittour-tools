<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>로그인 · MERITTOUR 사내 도구함</title>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/access.js"></script>
<style>
  :root{
    --bg:#EEF2F8; --surface:#fff; --navy:#1a2332; --accent:#2E5A88; --accent2:#4A7BB0;
    --text:#22303F; --text2:#5A6A7A; --text3:#8A97A6; --border:#D8E0EA; --border2:#C3CEDB;
    --red:#C0392B; --red-dim:#FDECEA; --amber:#B7791F; --amber-dim:#FEF6E7;
    --green:#1E7A4C; --green-dim:#E7F6EE;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    width:100%;max-width:400px;padding:34px 30px;box-shadow:0 2px 20px rgba(26,35,50,.06)}
  .brand{display:flex;align-items:center;gap:9px;margin:0 0 4px;
    font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--text2)}
  .brand .mark{width:22px;height:22px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 34% 30%,var(--accent2),var(--navy))}
  h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;color:var(--navy)}
  .sub{font-size:13.5px;color:var(--text2);margin:0 0 22px;line-height:1.6}
  label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin:0 0 5px}
  input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:9px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,90,136,.12)}
  .field+.field{margin-top:13px}
  button.go{width:100%;margin-top:20px;padding:12px;border:none;border-radius:9px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
  button.go:hover{background:var(--navy)}
  button.go:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:16px;font-size:13.5px;line-height:1.6;border-radius:9px;padding:11px 13px;display:none}
  .msg.on{display:block}
  .msg.err{background:var(--red-dim);color:var(--red);border:1px solid #F5C6C0}
  .msg.warn{background:var(--amber-dim);color:var(--amber);border:1px solid #F0DCB0}
  .msg.ok{background:var(--green-dim);color:var(--green);border:1px solid #B7E2CB}
  .foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);
    font-size:12px;color:var(--text3);line-height:1.7}
  .foot b{color:var(--text2)}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark" aria-hidden="true"></span> MERITTOUR 사내 도구함</div>

  <!-- 로그인 -->
  <div id="view-login">
    <h1>로그인</h1>
    <p class="sub">등록된 이메일로 로그인해 주세요.<br>계정은 관리자가 발급합니다.</p>
    <form id="form-login" autocomplete="on">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input type="password" id="pw" name="password" autocomplete="current-password" required>
      </div>
      <button class="go" type="submit" id="btn-login">로그인</button>
    </form>
  </div>

  <!-- 초대 링크로 들어온 경우: 비밀번호 설정 -->
  <div id="view-invite" class="hide">
    <h1>비밀번호 설정</h1>
    <p class="sub">초대받으신 계정의 비밀번호를 정해 주세요.<br>다음부터는 이 비밀번호로 로그인하시면 됩니다.</p>
    <form id="form-invite">
      <div class="field">
        <label for="pw1">새 비밀번호 <span style="font-weight:600;color:var(--text3)">(8자 이상)</span></label>
        <input type="password" id="pw1" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label for="pw2">한 번 더</label>
        <input type="password" id="pw2" autocomplete="new-password" required minlength="8">
      </div>
      <button class="go" type="submit" id="btn-invite">비밀번호 저장</button>
    </form>
  </div>

  <!-- 승인 대기 -->
  <div id="view-pending" class="hide">
    <h1>승인 대기 중</h1>
    <p class="sub" id="pending-who"></p>
    <div class="msg warn on">
      계정은 만들어졌지만 아직 <b>사용 승인이 나지 않았습니다.</b><br>
      관리자에게 승인을 요청해 주세요.
    </div>
    <button class="go" type="button" id="btn-logout" style="background:var(--text3)">다른 계정으로 로그인</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="foot" id="foot">
    로그인은 <b>사내 데이터 공유(등록소)</b>에 쓰입니다.<br>
    계정 발급·승인은 관리자에게 문의해 주세요.
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var NEXT_DEFAULT = '../sales/';

  function show(id) {
    ['view-login', 'view-invite', 'view-pending'].forEach(function (v) {
      $(v).classList.toggle('hide', v !== id);
    });
  }
  function say(text, kind) {
    var m = $('msg');
    m.className = 'msg on ' + (kind || 'err');
    m.textContent = text;
  }
  function clearMsg() { $('msg').className = 'msg'; $('msg').textContent = ''; }

  /* 로그인 뒤 돌아갈 곳. ?next=... 로 받되 같은 사이트 안으로만 보낸다
     (외부 주소를 그대로 따라가면 열린 리다이렉트가 된다). */
  function nextUrl() {
    try {
      var raw = new URLSearchParams(location.search).get('next') || '';
      if (!raw) return NEXT_DEFAULT;
      if (/^https?:\/\//i.test(raw) || raw.indexOf('//') === 0) return NEXT_DEFAULT;
      return raw;
    } catch (e) { return NEXT_DEFAULT; }
  }

  function afterLogin(user) {
    if (!user) { say('계정 정보를 찾지 못했습니다. 관리자에게 문의해 주세요.'); return; }
    if (!user.active) {
      show('view-pending');
      $('pending-who').textContent = (user.name || user.email) + ' 님';
      clearMsg();
      return;
    }
    location.href = nextUrl();
  }

  /* ── 설정이 비어 있으면 먼저 알린다 ─────────────────────────── */
  if (!MT_AUTH.configured()) {
    say('접속 설정이 아직 비어 있습니다. shared/supabase-config.js 에 Supabase URL 과 anon key 를 넣어 주세요.', 'warn');
    $('btn-login').disabled = true;
  }

  /* ── 초대 · 비밀번호 재설정 링크 ────────────────────────────── */
  var adopted = MT_AUTH.adoptHash(location.hash);
  if (adopted) {
    history.replaceState(null, '', location.pathname + location.search);  // 주소창에서 토큰 제거
    show('view-invite');
    if (adopted.type === 'recovery') {
      document.querySelector('#view-invite h1').textContent = '비밀번호 재설정';
    }
  } else {
    /* 이미 로그인돼 있으면 바로 통과시킨다 */
    MT_AUTH.me().then(function (u) { if (u) afterLogin(u); }).catch(function () {});
  }

  /* ── 로그인 ─────────────────────────────────────────────────── */
  $('form-login').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    var btn = $('btn-login');
    btn.disabled = true; btn.textContent = '확인 중…';
    MT_AUTH.login($('email').value, $('pw').value)
      .then(afterLogin)
      .catch(function (err) { say(err && err.message ? err.message : '로그인에 실패했습니다.'); })
      .then(function () { btn.disabled = false; btn.textContent = '로그인'; });
  });

  /* ── 비밀번호 설정 ──────────────────────────────────────────── */
  $('form-invite').addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    var a = $('pw1').value, b = $('pw2').value;
    if (a !== b) { say('두 비밀번호가 다릅니다.'); return; }
    if (a.length < 8) { say('비밀번호는 8자 이상으로 정해 주세요.'); return; }
    var btn = $('btn-invite');
    btn.disabled = true; btn.textContent = '저장 중…';
    MT_AUTH.setPassword(a)
      .then(function () {
        say('비밀번호를 저장했습니다.', 'ok');
        return MT_AUTH.me(true);
      })
      .then(function (u) { if (u) setTimeout(function () { afterLogin(u); }, 700); })
      .catch(function (err) { say(err && err.message ? err.message : '저장에 실패했습니다.'); })
      .then(function () { btn.disabled = false; btn.textContent = '비밀번호 저장'; });
  });

  /* ── 다른 계정으로 ──────────────────────────────────────────── */
  $('btn-logout').addEventListener('click', function () {
    MT_AUTH.logout().then(function () { location.reload(); });
  });
})();
</script>
</body>
</html>
