<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MERITTOUR · AIR</title>
<script src="../shared/guard.js" data-section="air"></script>
<link rel="stylesheet" href="../shared/core.css">
<meta name="robots" content="noindex, nofollow" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }


body, body * { transition: background-color .25s, border-color .25s, color .15s; }
.hidden { display: none !important; }
html, body { font-family: var(--mt-sans); background: var(--mt-bg); color: var(--mt-text); font-size: 14px; line-height: 1.55; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 24px; margin-bottom: 28px; border-bottom: 1px solid var(--mt-border); }
.brand-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand-logo { height: 20px; width: auto; display: block; }
.brand { font-size: 22px; font-weight: 700; color: var(--mt-brand); letter-spacing: -0.02em; }
.brand-sub { font-size: 11px; color: var(--mt-text3); font-family: var(--mt-mono); letter-spacing: 0.08em; }
.dept-badge { font-size: 11px; font-weight: 700; font-family: var(--mt-mono); background: var(--mt-accent-dim); color: var(--mt-accent); border: 1px solid var(--mt-accent); padding: 3px 10px; border-radius: 20px; letter-spacing: 0.08em; }
.dept-badge.admin { background: var(--mt-point-dim); color: var(--mt-point); border-color: var(--mt-point); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.user-info { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--mt-surface); border: 1px solid var(--mt-border); border-radius: 24px; font-size: 12px; color: var(--mt-text2); }
.user-info img { width: 24px; height: 24px; border-radius: 50%; }
.theme-toggle { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--mt-border); color: var(--mt-text2); border-radius: 8px; cursor: pointer; font-size: 16px; }
.theme-toggle:hover { border-color: var(--mt-accent); color: var(--mt-accent); }
.ghost-btn { background: transparent; border: 1px solid var(--mt-border); color: var(--mt-text2); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: var(--mt-sans); transition: all .15s; }
.ghost-btn:hover { border-color: var(--mt-accent); color: var(--mt-accent); }
.section-title { font-size: 11px; font-weight: 700; color: var(--mt-text2); text-transform: uppercase; letter-spacing: 0.12em; margin: 28px 0 14px; display: flex; align-items: center; gap: 10px; }
.section-title::before { content: ''; width: 3px; height: 13px; background: var(--mt-accent); border-radius: 2px; display: block; }
.section-title:first-of-type { margin-top: 4px; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.tool-card { background: var(--mt-surface); border: 1px solid var(--mt-border); border-radius: 12px; padding: 18px 18px 16px; box-shadow: var(--mt-shadow); cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; position: relative; min-height: 140px; }
.tool-card:hover { transform: translateY(-2px); border-color: var(--mt-accent); box-shadow: var(--mt-shadow-lg); }
.tool-card.disabled { opacity: 0.5; cursor: not-allowed; }
.tool-card.disabled:hover { transform: none; border-color: var(--mt-border); box-shadow: var(--mt-shadow); }
.tool-card.disabled::after { content: '준비 중'; position: absolute; top: 12px; right: 12px; font-size: 10px; font-family: var(--mt-mono); color: var(--mt-text3); background: var(--mt-surface3); padding: 2px 7px; border-radius: 10px; letter-spacing: 0.04em; }
.tool-card-icon { font-size: 22px; width: 40px; height: 40px; border-radius: 8px; background: var(--mt-accent-dim); display: flex; align-items: center; justify-content: center; }
.tool-card-title { font-size: 15px; font-weight: 600; color: var(--mt-brand); }
.tool-card-desc { font-size: 12px; color: var(--mt-text2); flex: 1; }
.tool-card-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-family: var(--mt-mono); background: var(--mt-accent-dim); color: var(--mt-accent); border: 1px solid var(--mt-accent); letter-spacing: 0.04em; }
.badge.ver { background: var(--mt-surface3); color: var(--mt-text3); border-color: var(--mt-border); }
.badge.team { background: var(--mt-green-dim); color: var(--mt-green); border-color: var(--mt-green); }
.badge.team.ops { background: var(--mt-amber-dim); color: var(--mt-amber); border-color: var(--mt-amber); }
.badge.team.guest { background: #DBEAFE; color: #353C48; border-color: #353C48; }

.empty-area { background: var(--mt-surface); border: 1px dashed var(--mt-border2); border-radius: 12px; padding: 36px 20px; text-align: center; color: var(--mt-text3); font-size: 13px; line-height: 1.7; }
.empty-area strong { display: block; color: var(--mt-text2); font-size: 14px; margin-bottom: 6px; }
.notes-section { margin-top: 36px; background: var(--mt-surface); border: 1px solid var(--mt-border); border-radius: 12px; padding: 20px 22px; box-shadow: var(--mt-shadow); }
.notes-section h3 { font-size: 13px; color: var(--mt-brand); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
.notes-section h3::before { content: ''; width: 3px; height: 13px; background: var(--mt-point); border-radius: 2px; }
.notes-section h3:not(:first-child) { margin-top: 22px; }
.notes-section ul { list-style: none; padding-left: 0; }
.notes-section li { font-size: 12.5px; color: var(--mt-text2); padding: 6px 0 6px 16px; position: relative; line-height: 1.6; }
.notes-section li::before { content: '·'; position: absolute; left: 4px; color: var(--mt-accent); font-weight: 700; }
.notes-section li .date { display: inline-block; font-family: var(--mt-mono); font-size: 10px; color: var(--mt-text3); background: var(--mt-surface3); padding: 1px 6px; border-radius: 4px; margin-right: 6px; letter-spacing: 0.04em; }
.notes-section li strong { color: var(--mt-text); font-weight: 600; }
.notes-section code { font-family: var(--mt-mono); background: var(--mt-surface3); padding: 1px 5px; border-radius: 3px; font-size: 11px; }
.footer-tip { text-align: center; color: var(--mt-text3); font-size: 11px; margin-top: 48px; font-family: var(--mt-mono); letter-spacing: 0.06em; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand-wrap">
      <a href="../" title="홈으로" style="display:inline-flex;align-items:center;text-decoration:none"><img src="../assets/logo-merittour-horizontal.svg" alt="MERITTOUR" class="brand-logo"></a>
      <div class="brand-sub">INTERNAL TOOLS</div>
    </div>
    <div class="header-actions">

    </div>
  </div>


  <div class="section-title">항공팀 도구</div>
  <div class="empty-area">
    <strong>이 영역은 비어 있습니다</strong>
    항공팀 전용 도구는 아직 등록되지 않았습니다.<br>
    필요한 도구가 있으면 시스템 관리자에게 요청해 주세요.
  </div>


  <div class="footer-tip">MERITTOUR · 02-365-9800 · MAPO-GU SEOUL</div>
</div>

<!-- 구글 로그인 잔재는 없앴다. 네 파일 모두 <script> 가 주석 처리돼 로드되지 않았고
     auth.js 의 CONFIG.ENABLED 도 false 라 이중으로 죽어 있었다.
     실제 로그인은 Supabase Auth(shared/access.js)와 로그인 문지기(shared/guard.js)가 한다. -->
</body>
</html>
